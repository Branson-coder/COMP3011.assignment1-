# Server
server.port=8080

# Tomcat thread pool - sized to comfortably accept >200 concurrent requests.
# Because the OpenAI call is made through the non-blocking WebClient and the
# controller returns a CompletableFuture, these threads are never held for
# the duration of the upstream STT call - they're only needed briefly to
# read the incoming multipart body and to write the final response.
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=300
server.tomcat.max-connections=10000

# How long Spring MVC will wait for an async controller method (like our
# CompletableFuture-returning transcribe endpoint) before timing it out.
spring.mvc.async.request-timeout=20000

# Upload size limits - short voice clips only
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAI settings (read at runtime, see OpenAiProperties)
# OPENAI_API_KEY is intentionally NOT set here - it must come only from the
# OS environment variable, per the assignment's security requirement.
stt.openai.transcription-url=https://api.openai.com/v1/audio/transcriptions
stt.openai.model=gpt-4o-mini-transcribe

# Default active profile for local dev; TITAN should set
# SPRING_PROFILES_ACTIVE=titan (or leave default - both read the same env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Never let Spring log request/response bodies at INFO in case of accidental
# header logging - keep default logging level sane.
logging.level.root=INFO
logging.level.org.springframework.web=INFO
